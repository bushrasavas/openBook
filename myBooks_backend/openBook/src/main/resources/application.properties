spring.datasource.url = jdbc:mysql://localhost:3307/openBook
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD}
## Hibernate Properties
# The SQL dialect for the underlying database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
# Hibernate ddl auto (options: create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
#Dump the SQL queries to standard out
spring.jpa.show-sql = true
#To pretty print the SQL
spring.jpa.properties.hibernate.format_sql= true

# Multipart (upload a file)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB